spring.application.name=backend

# ========================
# PostgreSQL Configuration
# ========================
spring.datasource.url=jdbc:postgresql://localhost:5432/cinema
spring.datasource.username=postgres
spring.datasource.password=sa
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================
# JPA / Hibernate
# ========================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ========================
# Server Port
# ========================
server.port=8080

# ========================
# Spring Boot Servlet Encoding (UTF-8 fix)
# ========================
# Bat buoc tat ca request/response dung UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=true

# ========================
# JWT Configuration
# ========================
app.jwt.secret=cinemaxp-super-secret-key-change-this-in-production-minimum-256-bits
app.jwt.expiration-ms=86400000

# ========================
# CORS (cho phep FE React goi API)
# ========================
app.cors.allowed-origins=http://localhost:5173

# ========================
# Mail Configuration
# ========================
